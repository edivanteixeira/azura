name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin,       os: macos-latest }
          - { target: x86_64-apple-darwin,        os: macos-latest }
          - { target: x86_64-unknown-linux-gnu,   os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu,  os: ubuntu-24.04-arm }
          - { target: x86_64-pc-windows-msvc,     os: windows-latest }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: empacota
        if: runner.os != 'Windows'
        run: |
          tar -C target/${{ matrix.target }}/release -czf azura-${{ matrix.target }}.tar.gz azura
          shasum -a 256 azura-${{ matrix.target }}.tar.gz > azura-${{ matrix.target }}.tar.gz.sha256

      - name: empacota (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/azura.exe -DestinationPath azura-${{ matrix.target }}.zip
          (Get-FileHash azura-${{ matrix.target }}.zip -Algorithm SHA256).Hash.ToLower() + "  azura-${{ matrix.target }}.zip" | Out-File -Encoding ascii azura-${{ matrix.target }}.zip.sha256

      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            azura-*.tar.gz
            azura-*.zip
            azura-*.sha256
