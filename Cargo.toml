[package]
name = "azura"
version = "0.1.6"
edition = "2024"
rust-version = "1.85"
description = "Azure DevOps pull requests, pipelines and releases in your terminal"
license = "MIT"
repository = "https://github.com/edivanteixeira/azura"
homepage = "https://github.com/edivanteixeira/azura"
keywords = ["azure-devops", "tui", "cli", "pipelines", "pull-request"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"
exclude = ["assets/", ".github/"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = "0.4.45"
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3.34"
ratatui = "0.30"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "http2", "charset", "gzip", "system-proxy", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
similar = "3.2.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
toml = "1.1.5"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
